<style>
/* Layout: a masthead (thesis + how to read an example), then a reading shell — sticky contents rail beside one text
   column, where each example is a thread: the person's request (serif), the agent's tool call (mono), the result. */
:root {
  --bg: #f3f6f4; --sheet: #ffffff; --fg: #15201b; --fg2: #43514b; --fg3: #67756f;
  --rule: #d6ded9; --rule-soft: #e6ece8; --code-bg: #e9eeeb;
  --accent: #16694e; --accent-soft: #e0eee7; --ask-rule: #c0dacd;
  --tool: #36459a; --tool-soft: #e6e9f7;
  --warn: #875100; --warn-soft: #faefd9; --note: #1d5995; --note-soft: #e3edf8; --imp: #663b9b; --imp-soft: #eee6f8;
  --q0: #e3f0e9; --q1: #bedccc; --q2: #86bfa4; --q3: #2e7e60; --q4: #16694e; --q-lo: #15201b; --q-hi: #ffffff;
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --sheet: #141c18; --fg: #e1e9e4; --fg2: #adb9b3; --fg3: #84918a;
    --rule: #29352f; --rule-soft: #1d2723; --code-bg: #1b2520;
    --accent: #62c79f; --accent-soft: #15281f; --ask-rule: #244538;
    --tool: #adb8f2; --tool-soft: #1d233f;
    --warn: #ecbd62; --warn-soft: #2a2110; --note: #86bbee; --note-soft: #122339; --imp: #c7a5ee; --imp-soft: #241a35;
    --q0: #17271f; --q1: #1d3f31; --q2: #2a6049; --q3: #3e9171; --q4: #7dd3ae; --q-lo: #e1e9e4; --q-hi: #0d1311;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --sheet: #141c18; --fg: #e1e9e4; --fg2: #adb9b3; --fg3: #84918a;
  --rule: #29352f; --rule-soft: #1d2723; --code-bg: #1b2520;
  --accent: #62c79f; --accent-soft: #15281f; --ask-rule: #244538;
  --tool: #adb8f2; --tool-soft: #1d233f;
  --warn: #ecbd62; --warn-soft: #2a2110; --note: #86bbee; --note-soft: #122339; --imp: #c7a5ee; --imp-soft: #241a35;
  --q0: #17271f; --q1: #1d3f31; --q2: #2a6049; --q3: #3e9171; --q4: #7dd3ae; --q-lo: #e1e9e4; --q-hi: #0d1311;
  color-scheme: dark;
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  background: var(--bg); color: var(--fg);
  font: 400 1.0625rem/1.65 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--mono); font-size: .84em; background: var(--code-bg); padding: .12em .38em; border-radius: 4px; overflow-wrap: anywhere; }
[id] { scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 20px); }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: var(--bar-h); }
.brand { display: flex; align-items: baseline; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand-mark { font-family: var(--serif); font-size: 1.35rem; line-height: 1; color: var(--accent); }
.brand-sub { font-weight: 400; color: var(--fg3); }
.bar-end { display: flex; align-items: center; gap: 18px; }
.bar-end > a { font-size: .88rem; color: var(--fg2); text-decoration: none; }
.bar-end > a:hover { color: var(--fg); }
.switch { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); }
.switch button {

}

@media (max-width: 480px) { .bar-end > a { display: none; } .brand-sub { display: none; } }

/* masthead */

.mast-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 56px; align-items: start; padding-block: 56px 48px; }
@media (max-width: 959px) { .mast-grid { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 36px 32px; } }
.eyebrow { font: 500 .8rem/1 var(--mono); color: var(--accent); margin: 0; }

/* shell */

.toc { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 28px); align-self: start; max-height: calc(100vh - var(--bar-h) - 56px); overflow: auto; padding-top: 30px; }

@media (max-width: 959px) {

/* document */
.doc { min-width: 0; max-width: 860px; }
.doc p, .doc ul, .doc ol { margin: 0 0 1em; }
.doc > p, .doc > section > p, .doc > section > ul, .doc > section > ol:not(.steps) { max-width: 68ch; text-wrap: pretty; }
.doc li { margin-bottom: .45em; }
.doc li::marker { color: var(--fg3); }
.sec + .sec { border-top: 1px solid var(--rule); margin-top: 56px; }

h2 .num, h3 .num { font: 500 .8rem/1 var(--mono); color: var(--accent); letter-spacing: .02em; }
h3 { font: 500 1.42rem/1.25 var(--serif); margin: 44px 0 16px; text-wrap: balance; }
h3 .num { margin-right: 8px; vertical-align: .18em; }

/* an example: request → tool call → result */
.ex { display: grid; margin: 30px 0; }
.ex-ask { justify-self: start; max-width: 62ch; background: var(--accent-soft); border: 1px solid var(--ask-rule); border-radius: 18px 18px 18px 4px; padding: 13px 20px 15px; }
.ex-k { display: block; font: 600 .68rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.ex-q { font: 400 1.17rem/1.45 var(--serif); color: var(--fg); margin: 0 !important; text-wrap: pretty; }

.ex-call { font-size: .92rem; line-height: 1.6; color: var(--fg2); margin: 0 !important; }
.ex-call .ex-k { display: inline; color: var(--fg3); margin: 0 6px 0 0; }
code.tool { background: var(--tool-soft); color: var(--tool); font-weight: 500; padding: .16em .5em; }
.ex-out { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; min-width: 0; }
.ex-out-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--rule); font: 600 .66rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); }
.ex-out-h code { background: none; padding: 0; font-size: .74rem; letter-spacing: 0; text-transform: none; color: var(--fg3); }
.ex-out > * + *:not(.ex-out-h):not(:nth-child(2)) { border-top: 1px solid var(--rule); }
.ex.legend { margin: 16px 0 18px; }
.ex.legend .ex-q { font-size: 1.05rem; }
@media (max-width: 600px) { .ex-agent { margin-left: 12px; padding-left: 12px; } .ex-q { font-size: 1.1rem; } }

/* code */
.pre { position: relative; min-width: 0; }
.doc > section > .pre { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; margin: 0 0 1.2em; }
.pre pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 400 .8rem/1.62 var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }

.pre:has(.copy) pre { padding-right: 84px; }
.copy { position: absolute; top: 8px; right: 8px; font: 500 .72rem/1 var(--sans); padding: 7px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--fg2); cursor: pointer; }
.copy:hover { color: var(--fg); border-color: var(--fg3); }

/* tables */
.tablewrap { overflow-x: auto; min-width: 0; }
.doc > section > .tablewrap { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; margin: 0 0 1.4em; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
th { font: 600 .68rem/1.3 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--fg3); text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: bottom; }
td { padding: 8px 14px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td code { font-size: .8rem; }
.tablewrap > table { min-width: 520px; }

/* figures */
.fig { margin: 0; min-width: 0; }
.fig img { display: block; width: 100%; height: auto; }
.fig figcaption { padding: 10px 14px 12px; font-size: .82rem; line-height: 1.5; color: var(--fg3); border-top: 1px solid var(--rule-soft); }
.fig-svg svg { display: block; width: 100%; height: auto; }
svg.pi-chart { --surface: var(--sheet); --ink: var(--fg); --ink2: var(--fg2); --grid: var(--rule-soft); --axis: var(--fg3); font-family: var(--sans); }
.fig-matrix .tablewrap { padding: 16px 14px 6px; }
.matrix { border-collapse: separate; border-spacing: 4px; width: auto; min-width: 0 !important; font-size: .9rem; }
.matrix th { border: 0; padding: 6px 10px; text-transform: none; letter-spacing: 0; font-size: .8rem; font-weight: 600; color: var(--fg2); }
.matrix th.corner { font: 400 .74rem/1.3 var(--mono); color: var(--fg3); }
.matrix thead th { text-align: right; }
.matrix td { min-width: 6.4rem; text-align: right; padding: 10px 12px; border: 0; border-radius: 6px; font-weight: 600; }
.matrix td span { font-weight: 400; opacity: .8; }
.q0 { background: var(--q0); color: var(--q-lo); } .q1 { background: var(--q1); color: var(--q-lo); } .q2 { background: var(--q2); color: var(--q-lo); }
.q3 { background: var(--q3); color: var(--q-hi); } .q4 { background: var(--q4); color: var(--q-hi); }
.qn { background: var(--rule-soft); color: var(--fg3); }

/* callouts */
.callout { --k: var(--note); --k-soft: var(--note-soft); display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; margin: 26px 0; padding: 15px 18px 16px; border-radius: 10px; background: var(--k-soft); max-width: 72ch; }
.callout.warning { --k: var(--warn); --k-soft: var(--warn-soft); }
.callout.important { --k: var(--imp); --k-soft: var(--imp-soft); }
.callout > svg { color: var(--k); margin-top: 1px; }
.callout-k { display: block; font: 600 .68rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--k); margin: 4px 0 8px; }
.callout p { margin: 0; font-size: .95rem; }

/* the whole case, step by step */
.steps { list-style: none; padding: 0; margin: 26px 0 !important; counter-reset: s; }
.steps li { counter-increment: s; position: relative; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); column-gap: 16px; padding-bottom: 18px; margin: 0; }
.steps li::before { content: counter(s); grid-row: span 2; width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--bg); color: var(--accent); font: 500 .85rem/1 var(--mono); display: grid; place-items: center; position: relative; z-index: 1; }
.steps li::after { content: ""; position: absolute; left: calc(1.1rem - 1px); top: 2.2rem; bottom: 0; border-left: 2px solid var(--rule); }
.steps li:last-child::after { display: none; }
.step-q { font: 400 1.12rem/1.45 var(--serif); margin: 4px 0 4px !important; }
.step-t { margin: 0 !important; font-size: .9rem; }
.step-t code, .tools-v code { background: var(--tool-soft); color: var(--tool); }

/* tools at a glance */
.tools { border-top: 1px solid var(--rule); margin: 8px 0 1.6em; }
.tools-row { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 6px 28px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.tools-k { font-weight: 600; font-size: .95rem; }

/* footer */

.foot .wrap { padding-block: 28px 44px; }
.foot p { margin: 0 0 10px; max-width: 80ch; }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 22px; }

<script>
(() => {
  const KEY = 'parlaibero-tutorial-lang';
  const blocks = { es: document.getElementById('lang-es'), en: document.getElementById('lang-en') };
  const buttons = document.querySelectorAll('[data-set-lang]');
  const narrow = matchMedia('(max-width: 959px)');
  let lang = null, current = null;

  function heads() { return blocks[lang].querySelectorAll('h2[id], h3[id]'); }
  function track() {
    let found = null;
    for (const h of heads()) { if (h.getBoundingClientRect().top < 150) found = h; else break; }
    current = found;
    blocks[lang].querySelectorAll('.toc a').forEach(a => a.classList.toggle('active', !!found && a.getAttribute('href') === '#' + found.id));
  }
  function setLang(l, keepPlace) {
    const place = keepPlace && current ? current.id.slice(3) : null;
    lang = l;
    for (const k in blocks) blocks[k].hidden = k !== l;
    document.documentElement.lang = l;
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setLang === l)));
    try { localStorage.setItem(KEY, l); } catch (e) {}
    if (place) { const t = document.getElementById(l + '-' + place); if (t) t.scrollIntoView({ block: 'start', behavior: 'instant' }); }
    track();
  }

  const hash = decodeURIComponent(location.hash.slice(1));
  let start = /^(es|en)(-|$)/.test(hash) ? hash.slice(0, 2) : null;
  if (!start) { try { start = localStorage.getItem(KEY); } catch (e) {} }
  if (start !== 'es' && start !== 'en') start = /^en\b/i.test(navigator.language || '') ? 'en' : 'es';
  document.querySelectorAll('details.toc').forEach(d => { d.open = !narrow.matches; });
  setLang(start, false);
  if (hash.length > 2) { const t = document.getElementById(hash); if (t) t.scrollIntoView({ block: 'start', behavior: 'instant' }); }

  buttons.forEach(b => b.addEventListener('click', () => setLang(b.dataset.setLang, true)));
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; track(); }); } }, { passive: true });
  document.querySelectorAll('details.toc a').forEach(a => a.addEventListener('click', () => {
    if (narrow.matches) a.closest('details').open = false;
  }));

  document.addEventListener('click', e => {
    const b = e.target.closest('.copy');
    if (!b) return;
    const pre = b.parentElement.querySelector('pre');
    const label = b.textContent;
    const done = () => { b.textContent = b.dataset.done; setTimeout(() => { b.textContent = label; }, 1600); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(pre.innerText).then(done, select); } catch (err) { select(); }
  });
})();
</script>
