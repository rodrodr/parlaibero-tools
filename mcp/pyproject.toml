[project]
name = "parlaibero-mcp"
version = "0.2.1"
description = "MCP server for ParlaIbero: plenary speeches from 16 Ibero-American parliaments, for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rodrigo Rodrigues-Silveira" }]
keywords = ["mcp", "parliament", "parliamentary speeches", "Latin America", "Spain", "Portugal", "corpus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Natural Language :: Portuguese",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "mcp>=1.10",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://rodrodr.github.io/parlaibero/"
Repository = "https://github.com/rodrodr/parlaibero-tools"
Data = "https://dataverse.harvard.edu/dataverse/parlaibero"

[project.scripts]
parlaibero-mcp = "parlaibero_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parlaibero_mcp"]
