threshold_auto: 0.90
threshold_flag: 0.70
thresholds:
  diaries-match:
    threshold_auto: 0.90
    threshold_flag: 0.70
match:
  fuzzy_threshold: 85          # token_set_ratio (más permisivo que el antiguo token_sort_ratio)
  ambiguity_margin: 4          # 2+ candidatos dentro de este margen → ambiguous (desambiguar por contexto)
  max_llm_batch_size: 20
  context_interventions: 3
